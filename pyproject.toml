[project]
name = "ai-assistant"
version = "0.1.0"
description = "Track B agentic AI assistant with MLflow and Evidently evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.136.1",
    "langchain>=1.3.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-groq>=1.1.2",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.0",
    "mlflow>=3.5.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=6.0.0",
    "streamlit>=1.62.0",
    "evidently[llm]>=0.7.20",
    "groq>=0.37.1",
    "uvicorn>=0.46.0",
]

[project.scripts]
run-mlops-evaluation = "mlops.evaluate:main"
