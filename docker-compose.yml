services:

  ai-assistant:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-assistant

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./chroma_db:/app/chroma_db

    restart: unless-stopped

    command:
      - uvicorn
      - app.api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"